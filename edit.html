<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="my.css" rel="stylesheet">
    <title>노트 수정 - Note CRUD</title>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">📝Note CRUD</a>
        </div>
    </nav>

    <main>
        <div class="container py-4">
            <header class="pb-3 mb-4 border-bottom d-flex justify-content-between align-items-center flex-wrap gap-2">
                <div>
                    <h1 class="display-6 fw-bold">노트 수정</h1>
                    <p class="text-body-secondary mb-0">노트 내용을 수정하세요.</p>
                </div>
                <a href="index.html" class="btn btn-outline-secondary">목록으로</a>
            </header>

            <form id="noteForm" novalidate>
                <input type="hidden" id="noteId">

                <div class="mb-3">
                    <label for="title" class="form-label">제목<span class="required-mark">*</span></label>
                    <input type="text" class="form-control" id="title" name="title" placeholder="노트 제목을 입력하세요">
                    <div class="invalid-feedback">제목은 2자 이상 50자 이하로 입력해주세요.</div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="category" class="form-label">카테고리<span class="required-mark">*</span></label>
                        <select class="form-select" id="category" name="category">
                            <option value="" disabled>선택하세요</option>
                            <option value="업무">업무</option>
                            <option value="개인">개인</option>
                            <option value="아이디어">아이디어</option>
                            <option value="학습">학습</option>
                            <option value="여행">여행</option>
                            <option value="기타">기타</option>
                        </select>
                        <div class="invalid-feedback">카테고리를 선택해주세요.</div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="priority" class="form-label">중요도<span class="required-mark">*</span></label>
                        <select class="form-select" id="priority" name="priority">
                            <option value="" disabled>선택하세요</option>
                            <option value="낮음">낮음</option>
                            <option value="보통">보통</option>
                            <option value="높음">높음</option>
                        </select>
                        <div class="invalid-feedback">중요도를 선택해주세요.</div>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="content" class="form-label">내용<span class="required-mark">*</span></label>
                    <textarea class="form-control" id="content" name="content" rows="5" placeholder="노트 내용을 입력하세요"></textarea>
                    <div class="invalid-feedback">내용은 10자 이상 입력해주세요.</div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="createdAt" class="form-label">생성일<span class="required-mark">*</span></label>
                        <input type="date" class="form-control" id="createdAt" name="createdAt">
                        <div class="invalid-feedback">생성일을 입력해주세요.</div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="updatedAt" class="form-label">수정일<span class="required-mark">*</span></label>
                        <input type="date" class="form-control" id="updatedAt" name="updatedAt">
                        <div class="invalid-feedback">수정일은 생성일과 같거나 이후여야 합니다.</div>
                    </div>
                </div>

                <div class="d-flex justify-content-between mt-4">
                    <a href="#" id="cancelBtn" class="btn btn-outline-secondary">취소</a>
                    <button type="submit" class="btn btn-primary">수정</button>
                </div>
            </form>
        </div>
    </main>

    <footer>
        <p>© 2026 Note CRUD</p>
    </footer>

    <script>
        const notes = [
            { id: 1, title: '회의 안건 정리', category: '업무', priority: '높음', createdAt: '2026-09-01', updatedAt: '2026-09-03', content: '이번 주 팀 회의에서 다룰 안건을 정리한다.\n1. 프로젝트 일정 점검\n2. 리소스 배분 논의\n3. 다음 스프린트 목표 설정' },
            { id: 2, title: '장보기 목록', category: '개인', priority: '보통', createdAt: '2026-09-02', updatedAt: '2026-09-02', content: '우유, 계란, 식빵, 세제, 과일을 사야 한다.' },
            { id: 3, title: '사이드 프로젝트 구상', category: '아이디어', priority: '높음', createdAt: '2026-09-05', updatedAt: '2026-09-10', content: 'CRUD 연습용 노트 관리 서비스를 만들어보면 좋을 것 같다. Bootstrap과 바닐라 JS로 구현해보자.' },
            { id: 4, title: '운영체제 중간고사 정리', category: '학습', priority: '보통', createdAt: '2026-09-06', updatedAt: '2026-09-12', content: '프로세스 스케줄링, 메모리 관리, 데드락 관련 개념을 정리한다.' },
            { id: 5, title: '부산 여행 일정', category: '여행', priority: '낮음', createdAt: '2026-09-08', updatedAt: '2026-09-08', content: '1일차: 해운대, 2일차: 감천문화마을, 3일차: 광안리' },
            { id: 6, title: '읽고 싶은 책 목록', category: '기타', priority: '낮음', createdAt: '2026-09-10', updatedAt: '2026-09-15', content: '클린 코드, 리팩터링, 이펙티브 자바를 읽고 싶다.' }
        ];

        const params = new URLSearchParams(window.location.search);
        const requestedId = parseInt(params.get('id'), 10);
        const note = notes.find(n => n.id === requestedId) || notes[0];

        document.getElementById('noteId').value = note.id;
        document.getElementById('title').value = note.title;
        document.getElementById('category').value = note.category;
        document.getElementById('priority').value = note.priority;
        document.getElementById('content').value = note.content;
        document.getElementById('createdAt').value = note.createdAt;
        document.getElementById('updatedAt').value = note.updatedAt;
        document.getElementById('cancelBtn').href = 'view.html?id=' + note.id;

        document.getElementById('noteForm').addEventListener('submit', function (e) {
            e.preventDefault();
            let valid = true;

            const title = document.getElementById('title');
            const titleLen = title.value.trim().length;
            if (titleLen < 2 || titleLen > 50) {
                title.classList.add('is-invalid');
                valid = false;
            } else {
                title.classList.remove('is-invalid');
            }

            const category = document.getElementById('category');
            if (!category.value) {
                category.classList.add('is-invalid');
                valid = false;
            } else {
                category.classList.remove('is-invalid');
            }

            const priority = document.getElementById('priority');
            if (!priority.value) {
                priority.classList.add('is-invalid');
                valid = false;
            } else {
                priority.classList.remove('is-invalid');
            }

            const content = document.getElementById('content');
            if (content.value.trim().length < 10) {
                content.classList.add('is-invalid');
                valid = false;
            } else {
                content.classList.remove('is-invalid');
            }

            const createdAt = document.getElementById('createdAt');
            if (!createdAt.value) {
                createdAt.classList.add('is-invalid');
                valid = false;
            } else {
                createdAt.classList.remove('is-invalid');
            }

            const updatedAt = document.getElementById('updatedAt');
            if (!updatedAt.value || (createdAt.value && updatedAt.value < createdAt.value)) {
                updatedAt.classList.add('is-invalid');
                valid = false;
            } else {
                updatedAt.classList.remove('is-invalid');
            }

            if (!valid) {
                return;
            }

            if (confirm('게시물을 수정할까요?')) {
                alert('수정되었습니다.');
                window.location.href = 'view.html?id=' + note.id;
            }
        });
    </script>
</body>
</html>
